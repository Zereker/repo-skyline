[package]
name = "repo-skyline-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "repo-skyline"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
git-analyzer = { path = "../git-analyzer" }
city-model = { path = "../city-model" }
